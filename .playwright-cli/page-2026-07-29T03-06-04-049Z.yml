            - paragraph [ref=e152]: The traveler
            - heading "Lute" [level=3] [ref=e153]
            - paragraph [ref=e154]: The young protagonist heading toward Orbis. Lute is your point of view into the world and the natural anchor for learning core movement, melee pressure and party switching.
            - list [ref=e155]:
              - listitem [ref=e156]: Story protagonist
              - listitem [ref=e157]: Beginner-friendly foundation
