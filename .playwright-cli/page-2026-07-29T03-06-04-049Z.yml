    - generic [ref=e182]:
      - generic [ref=e183]:
        - paragraph [ref=e184]: Progression & stage tips
        - heading "Your spoiler-light route through Orbis" [level=2] [ref=e186]
        - paragraph [ref=e187]: Use these checkpoints when the game opens up or a difficult encounter stalls your progress.
      - generic [ref=e188]:
        - article [ref=e190]:
          - generic [ref=e191]: I
          - 'img "A bright city area in DragonSword: Awakening" [ref=e193]'
          - generic [ref=e194]:
            - paragraph [ref=e195]: Opening hours
            - heading "Learn one complete handoff" [level=3] [ref=e196]
            - paragraph [ref=e197]: Use early encounters to memorize a single Status Ailment → Signal Skill pair. Consistency is more useful than trying every hero at once.
            - list [ref=e198]:
              - listitem [ref=e199]: Finish tutorials before chasing distant map icons.
              - listitem [ref=e200]: Equip upgrades you find; save deep optimization for later.
              - listitem [ref=e201]: Talk to quest-givers and check rewards for hero progression.
        - article [ref=e202]:
          - generic [ref=e203]: II
          - 'img "An open landscape ready for exploration in DragonSword: Awakening" [ref=e205]'
          - generic [ref=e206]:
            - paragraph [ref=e207]: Open-world phase
            - heading "Explore in loops, not straight lines" [level=3] [ref=e208]
            - paragraph [ref=e209]: Travel from a hub toward one objective, clear nearby discoveries, then return. This keeps upgrades and side content close to your current power level.
            - list [ref=e210]:
              - listitem [ref=e211]: Activate travel points whenever you enter a new region.
              - listitem [ref=e212]: Gather cooking materials while moving between quests.
              - listitem [ref=e213]: Use mounts for distance; dismount early near hostile groups.
        - article [ref=e214]:
          - generic [ref=e215]: III
          - 'img "A dungeon environment in DragonSword: Awakening" [ref=e217]'
          - generic [ref=e218]:
            - paragraph [ref=e219]: Dungeons
            - heading "Arrive with a job for each hero" [level=3] [ref=e220]
            - paragraph [ref=e221]: Before entering, decide who starts the combo, who converts the ailment into burst damage and who gives you a safe reset.
            - list [ref=e222]:
              - listitem [ref=e223]: Keep one crowd-control or area option for grouped enemies.
              - listitem [ref=e224]: Do not use every ultimate on the first wave.
              - listitem [ref=e225]: Check side rooms and vertical paths before leaving.
        - article [ref=e226]:
          - generic [ref=e227]: IV
          - 'img "A party fighting a giant dragon boss in DragonSword: Awakening" [ref=e229]'
          - generic [ref=e230]:
            - paragraph [ref=e231]: Boss walls
            - heading "Survive one cycle before chasing damage" [level=3] [ref=e232]
            - paragraph [ref=e233]: On a new boss, spend the first attempt learning tells. Large attacks usually become manageable once you recognize the pause, sound or posture that precedes them.
            - list [ref=e234]:
              - listitem [ref=e235]: Attack after a completed pattern, not during the wind-up.
              - listitem [ref=e236]: Hold your signal chain for a stagger or safe opening.
              - listitem [ref=e237]: If time runs out, upgrade damage; if you fall early, fix defense and timing.
      - complementary [ref=e238]:
        - paragraph [ref=e239]: "#01"
        - generic [ref=e240]:
          - paragraph [ref=e241]: Best universal tip
          - heading "Stop attacking half a second earlier." [level=3] [ref=e243]
        - paragraph [ref=e244]: That tiny pause lets you see the counterattack, dodge cleanly and restart a much longer combo. In action RPGs, restraint is a damage stat.
