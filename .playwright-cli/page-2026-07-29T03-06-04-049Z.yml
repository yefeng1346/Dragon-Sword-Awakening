        - heading "A bright world with a dragon-shaped shadow" [level=2] [ref=e69]
      - generic [ref=e70]:
        - generic [ref=e71]:
          - paragraph [ref=e72]: "DragonSword: Awakening is an anime-style open-world action RPG set on the Continent of Orbis, sixty years after a legendary dragon last threatened the land."
          - paragraph [ref=e73]:
            - text: You play as
            - strong [ref=e74]: Lute
            - text: ", a young traveler drawn into mercenary life after meeting Johnny and the Elf Castella. What begins as a lively journey through human civilization soon grows into a continent-spanning fight against an awakened ancient threat."
          - paragraph [ref=e75]: "The game mixes free-roaming exploration, story quests, dungeons, cooking, mounts and large enemy encounters with a combat system built around switching between heroes at the right moment. It looks like a character collector, but the Steam edition is a premium RPG: every playable hero can be earned through play."
          - paragraph [ref=e79]:
            - strong [ref=e80]: "Before you begin:"
            - text: Play it like a party action RPG, not a solo-character brawler. The strongest early upgrade is learning how your three heroes hand attacks to one another.
        - figure "World file 01 Orbis rewards curiosity above and below the surface." [ref=e81]:
