        - heading "Meet the first names in Lute's story" [level=2] [ref=e146]
        - paragraph [ref=e147]: The launch roster contains 19 playable heroes. These three define the opening journey; let their mechanics teach you what kind of party you enjoy.
      - generic [ref=e148]:
