            - heading "Castella" [level=3] [ref=e171]
            - paragraph [ref=e172]: An eccentric Elf who joins Lute early. She broadens the party beyond straightforward swordplay and encourages you to pay attention to control, setup and the timing of team interactions.
            - list [ref=e173]:
              - listitem [ref=e174]: Early companion
