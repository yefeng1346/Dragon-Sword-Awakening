            - paragraph [ref=e161]: The mercenary
            - heading "Johnny" [level=3] [ref=e162]
            - paragraph [ref=e163]: "A seasoned mercenary who pulls Lute into hired life. His story role represents the confident, forward-moving side of combat: act decisively, then create room before the counterattack."
            - list [ref=e164]:
              - listitem [ref=e165]: Early companion
              - listitem [ref=e166]: Aggressive combat identity
